# Promote a staged issues model to ACTIVE, backing up any current ACTIVE model.
name: "Labeler: Promotion"

on:
  workflow_dispatch:
    inputs:
      staged_key:
        description: "Staged model cache suffix to promote to ACTIVE."
        required: true
        default: "staged"
      backup_key:
        description: "Cache suffix for backing up the current ACTIVE model. Use a fresh suffix for each promotion."
        required: false
        default: "backup"

permissions: {}

jobs:
  promote-issues:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Promote Model for Issues"
        uses: dotnet/issue-labeler/promote@94442c952121cb5448aaa7e247f65be93c07632e # v2.3.0
        with:
          type: "issues"
          staged_key: ${{ inputs.staged_key }}
          backup_key: ${{ inputs.backup_key }}
