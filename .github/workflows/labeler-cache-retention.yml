# Regularly restore the ACTIVE issues model to prevent cache eviction.
name: "Labeler: Cache Retention"

on:
  schedule:
    - cron: "36 4 * * *"

  workflow_dispatch:
    inputs:
      cache_key:
        description: "Model cache suffix to restore."
        required: true
        default: "ACTIVE"

permissions: {}

env:
  CACHE_KEY: ${{ github.event.inputs.cache_key || 'ACTIVE' }}

jobs:
  restore-cache:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        type: ["issues"]
    steps:
      - name: "Restore issues model from cache"
        uses: dotnet/issue-labeler/restore@94442c952121cb5448aaa7e247f65be93c07632e # v2.3.0
        with:
          type: ${{ matrix.type }}
          cache_key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
